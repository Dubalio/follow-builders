name: Send Digest

on:
  schedule:
    # Weekly, Monday 08:00 America/Argentina/Buenos_Aires (UTC-3, no DST)
    - cron: '0 11 * * 1'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Write local config and secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.follow-builders
          cat > ~/.follow-builders/config.json << EOF
          {
            "language": "en",
            "frequency": "weekly",
            "delivery": {
              "method": "telegram",
              "chatId": "$TELEGRAM_CHAT_ID"
            }
          }
          EOF
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" > ~/.follow-builders/.env

      - name: Pick top stories and send digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd scripts
          node pick-top-stories.js | node deliver.js

      - name: Clear the weekly buffer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo '{"builders":{}}' > weekly-buffer.json
          git add weekly-buffer.json
          git diff --cached --quiet || git commit -m "chore: reset weekly buffer [skip ci]"
          git push
